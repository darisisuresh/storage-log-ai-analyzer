name: Bug report
description: Report a reproducible parsing, detection, or reporting problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples only. Report security vulnerabilities privately: see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the commit SHA or installed package version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, vendor family, and log format.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal synthetic log example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Explain the mismatch and include relevant output or exit codes.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, customer identifiers, IP addresses, serial numbers, and real logs.
          required: true
