name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        extras: ["dev", "ai,dev"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: storage-log-analyzer --version
      - run: storage-log-analyzer analyze samples/mixed-storage.log --fail-on never
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --config pyproject.toml .
      - run: python -m build

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        format: ["log", "json"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/benchmark_p0.py --format ${{ matrix.format }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python scripts/build_web.py
      - run: node --check web/app.js
      - run: node --check web/worker.js
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check_web.cjs
