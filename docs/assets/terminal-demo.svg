<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 581" role="img" aria-labelledby="title"><title id="title">Actual CLI output on the bundled synthetic five-event sample</title><rect width="1050" height="100%" rx="18" fill="#111713"/><circle cx="28" cy="28" r="6" fill="#c8ff42"/><text x="48" y="34" font-family="monospace" font-size="15" fill="#a6afa8">SYNTHETIC SAMPLE · LOCAL ANALYSIS</text><text x="26" y="80" font-family="monospace" font-size="16" fill="#c8ff42" xml:space="preserve">Overall risk: CRITICAL</text><text x="26" y="105" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">Events: 5 | Files: 1</text><text x="26" y="130" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">Vendors: pure=2, emc=2, hpe=1</text><text x="26" y="155" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve"></text><text x="26" y="180" font-family="monospace" font-size="16" fill="#c8ff42" xml:space="preserve">[CRITICAL] STO-001 Drive or media failure (1 matches)</text><text x="26" y="205" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Identify the affected drive and protection state.</text><text x="26" y="230" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Open a vendor support case if redundancy is reduced.</text><text x="26" y="255" font-family="monospace" font-size="16" fill="#c8ff42" xml:space="preserve">[HIGH] SEC-001 Authentication failure (1 matches)</text><text x="26" y="280" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Validate the source and targeted account.</text><text x="26" y="305" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Rotate exposed credentials and review administrative audit logs.</text><text x="26" y="330" font-family="monospace" font-size="16" fill="#c8ff42" xml:space="preserve">[HIGH] STO-002 Storage path or port failure (1 matches)</text><text x="26" y="355" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Verify multipathing and fabric health.</text><text x="26" y="380" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Check switch, SFP, cable, and host HBA events.</text><text x="26" y="405" font-family="monospace" font-size="16" fill="#c8ff42" xml:space="preserve">[HIGH] STO-003 Capacity is critically high (1 matches)</text><text x="26" y="430" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Stop nonessential growth and confirm thin-provisioning risk.</text><text x="26" y="455" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Reclaim or add capacity before writes are affected.</text><text x="26" y="480" font-family="monospace" font-size="16" fill="#c8ff42" xml:space="preserve">[HIGH] STO-005 Replication or snapshot failure (1 matches)</text><text x="26" y="505" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Measure the recovery-point gap.</text><text x="26" y="530" font-family="monospace" font-size="16" fill="#edf1e8" xml:space="preserve">  - Restore replication and verify the latest usable recovery point.</text></svg>