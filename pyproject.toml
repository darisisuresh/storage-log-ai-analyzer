[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-log-ai-analyzer"
version = "0.3.0"
description = "Vendor-aware storage log monitoring and optional AI-assisted incident analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Storage Log AI Analyzer contributors"}]
keywords = ["storage", "logs", "monitoring", "pure-storage", "dell-emc", "hpe", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: System :: Monitoring",
]
dependencies = ["ijson>=3.6.0,<4"]

[project.urls]
Homepage = "https://sureshkumardarisi.com/#tools"
Repository = "https://github.com/darisisuresh/storage-log-ai-analyzer"
Documentation = "https://github.com/darisisuresh/storage-log-ai-analyzer/blob/main/docs/USAGE.md"
Issues = "https://github.com/darisisuresh/storage-log-ai-analyzer/issues"

[project.optional-dependencies]
ai = ["openai>=3.42.1,<4"]
dev = ["ruff==0.17.3", "build==1.6.1"]

[project.scripts]
storage-log-analyzer = "storage_log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
